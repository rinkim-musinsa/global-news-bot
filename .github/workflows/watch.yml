name: Taipei Evening Watch (태풍경보 중 저녁 집중 확인)
on:
  schedule:
    # 대만 휴무(停班停課)는 보통 전날 저녁 대만 시간 20~22시(한국 21~23시)에 발표돼요.
    # 한국 시간 20:00~23:45에 15분마다 확인 (태풍경보가 타이베이에 걸려 있을 때만 휴무 페이지까지 확인)
    - cron: '*/15 11-14 * * *'
  workflow_dispatch:      # Actions 탭에서 수동 실행 (휴일 체크 없이 바로 보냄)
    inputs:
      dry_run:
        description: '시험 실행 (슬랙으로 보내지 않고 로그에만 출력)'
        type: boolean
        default: false

permissions:
  contents: write          # 상태 기록(state.json)을 저장하기 위해 필요

concurrency:
  group: state-file        # 세 워크플로우가 동시에 state.json을 고치지 않도록
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL_HRBP: ${{ secrets.SLACK_CHANNEL_HRBP }}
        run: python bot.py watch ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "update state (watch)"
          git pull --rebase && git push
