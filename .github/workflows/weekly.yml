name: Weekly Digest (매주 첫 평일)
on:
  schedule:
    # 그 주 첫 평일에 1번만 보내요. 아침 예약이 밀릴 때를 대비해 3번 걸어두고, 이미 보냈으면 건너뛰어요
    - cron: '43 23 * * 0-4'   # 한국 시간 월~금 08:43
    - cron: '43 0 * * 1-5'    # 한국 시간 월~금 09:43
    - cron: '43 1 * * 1-5'    # 한국 시간 월~금 10:43
  workflow_dispatch:      # Actions 탭에서 수동 실행 (휴일 체크 없이 바로 보냄)

permissions:
  contents: write          # 상태 기록(state.json)을 저장하기 위해 필요

concurrency:
  group: state-file        # 세 워크플로우가 동시에 state.json을 고치지 않도록
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL_HRBP: ${{ secrets.SLACK_CHANNEL_HRBP }}
        run: python bot.py weekly ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "update state (weekly)"
          git pull --rebase && git push
